
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400">
  <title>By ErinXrz — Retro Pixel Adventure</title>
  <defs>
    <pattern id="pixels" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#FFFFFF" stroke-opacity=".035"/>
    </pattern>
    <linearGradient id="sky" x2="0" y2="1">
      <stop stop-color="#1689E8"/>
      <stop offset="1" stop-color="#83DFFF"/>
    </linearGradient>
    <linearGradient id="pipe" x2="1" y2="0">
      <stop stop-color="#087C3D"/>
      <stop offset=".45" stop-color="#43E66C"/>
      <stop offset="1" stop-color="#087D3A"/>
    </linearGradient>
    <linearGradient id="gold" x2="0" y2="1">
      <stop stop-color="#FFF5A0"/>
      <stop offset=".5" stop-color="#FFCB35"/>
      <stop offset="1" stop-color="#E88A16"/>
    </linearGradient>
  </defs>

  <!-- SKY -->
  <rect width="1200" height="400" fill="url(#sky)"/>
  <rect width="1200" height="400" fill="url(#pixels)"/>

  <!-- PIXEL SUN -->
