    <path d="M22 17h12V5h38v12h12v13H22z" fill="#F0444B"/>
    <path d="M34 5h38v8H34z" fill="#FF7474" stroke="none"/>
    <path d="M45 10h13v10H45z" fill="#FFF1A5" stroke="none"/>
    <!-- face details -->
