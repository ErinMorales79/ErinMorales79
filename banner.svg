<!-- Gradiente para Tubos Retro Nocturnos -->
<linearGradient id="pipeGreen" x1="0%" y1="0%" x2="100%" y2="0%">
  <stop offset="0%" stop-color="#1b4d24" />
  <stop offset="30%" stop-color="#2d7a3e" />
  <stop offset="70%" stop-color="#1f5c2e" />
  <stop offset="100%" stop-color="#0d2e14" />
</linearGradient>

<!-- Gradiente Bloque ? -->
<linearGradient id="questionBlock" x1="0%" y1="0%" x2="100%" y2="100%">
  <stop offset="0%" stop-color="#c9822b" />
  <stop offset="50%" stop-color="#a36218" />
  <stop offset="100%" stop-color="#6e3e0a" />
</linearGradient>

<!-- Gradiente Bloque Ladrillo Oscuro -->
<linearGradient id="brickDark" x1="0%" y1="0%" x2="100%" y2="100%">
  <stop offset="0%" stop-color="#612d22" />
  <stop offset="100%" stop-color="#3b1912" />
</linearGradient>

<!-- Sombra Pixel -->
<filter id="pixelShadow" x="-5%" y="-5%" width="110%" height="110%">
  <feDropShadow dx="3" dy="3" stdDeviation="0" flood-color="#000000" flood-opacity="0.6"/>
</filter>

<!-- Estilo de Fuente Retro Pixel -->
<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&amp;display=swap');
  .pixel-text { font-family: 'Press Start 2P', monospace; fill: #ffffff; }
  .hud-title { font-size: 14px; fill: #a5b4fc; }
  .hud-value { font-size: 16px; fill: #ffffff; font-weight: bold; }
  .brand-title { font-size: 38px; fill: #facc15; filter: drop-shadow(4px 4px 0px #000); }
  .sub-title { font-size: 14px; fill: #cbd5e1; filter: drop-shadow(2px 2px 0px #000); }
</style>


<text x="260" y="0" class="hud-title">DEGREE</text>
<text x="260" y="22" class="hud-value">SYSTEMS ENG.</text>

<text x="620" y="0" class="hud-title">WORLD</text>
<text x="620" y="22" class="hud-value">GT 1-1</text>

<text x="860" y="0" class="hud-title">LEVEL</text>
<text x="860" y="22" class="hud-value">SEM-08</text>


