    <!-- ear -->
    <path d="M18 39h9v15h-9z" fill="#FFD09A"/>
    <!-- hair -->
    <path d="M26 25h50v14H65v8H53v-8H39v8H26z" fill="#63362B"/>
    <path d="M65 43h11v12H65z" fill="#63362B"/>
