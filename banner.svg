
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420">
  <defs>
    <linearGradient id="nightSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#080E24"/>
      <stop offset="58%" stop-color="#111B3A"/>
      <stop offset="100%" stop-color="#202B4B"/>
    </linearGradient>

    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080D1B" stop-opacity=".96"/>
      <stop offset="100%" stop-color="#10182C" stop-opacity=".94"/>
    </linearGradient>

    <linearGradient id="moonGlow">
      <stop offset="0%" stop-color="#DDEBFF" stop-opacity=".20"/>
      <stop offset="100%" stop-color="#DDEBFF" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="shootingStar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#A9C8FF" stop-opacity="0"/>
      <stop offset="75%" stop-color="#C7DCFF" stop-opacity=".85"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>

    <pattern id="pixelGrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#A9BCE9" stroke-opacity=".035" stroke-width="1"/>
    </pattern>

    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>

    <clipPath id="sceneClip">
      <rect width="1200" height="420" rx="18"/>
    </clipPath>
  </defs>

  <g clip-path="url(#sceneClip)">
    <!-- Night sky -->
    <rect width="1200" height="420" fill="url(#nightSky)"/>
    <rect width="1200" height="420" fill="url(#pixelGrid)"/>

    <!-- Distant moon glow -->
    <circle cx="1020" cy="86" r="100" fill="url(#moonGlow)"/>
    <circle cx="1020" cy="86" r="29" fill="#C5D7F2" opacity=".90"/>
    <circle cx="1030" cy="78" r="28" fill="#111A35"/>

    <!-- Shooting star -->
    <path d="M785 47 L908 11" stroke="url(#shootingStar)" stroke-width="4" stroke-linecap="square"/>
    <path d="M816 42 L879 24" stroke="#A8C9FF" stroke-width="10" opacity=".12" filter="url(#softGlow)"/>
    <rect x="904" y="8" width="7" height="7" fill="#FFFFFF"/>
    <rect x="898" y="9" width="5" height="5" fill="#D8E7FF"/>
    <rect x="910" y="4" width="3" height="3" fill="#D8E7FF"/>

    <!-- Stars -->
    <g fill="#DCE8FF">
      <rect x="72" y="45" width="4" height="4"/>
      <rect x="155" y="94" width="3" height="3"/>
      <rect x="233" y="36" width="4" height="4"/>
      <rect x="328" y="82" width="3" height="3"/>
      <rect x="408" y="42" width="4" height="4"/>
      <rect x="490" y="103" width="3" height="3"/>
      <rect x="585" y="32" width="4" height="4"/>
      <rect x="681" y="76" width="3" height="3"/>
      <rect x="745" y="119" width="4" height="4"/>
      <rect x="958" y="143" width="3" height="3"/>
      <rect x="1102" y="47" width="4" height="4"/>
      <rect x="1145" y="127" width="3" height="3"/>
      <rect x="112" y="145" width="3" height="3"/>
      <rect x="278" y="142" width="4" height="4"/>
      <rect x="379" y="122" width="3" height="3"/>
      <rect x="552" y="145" width="4" height="4"/>
      <rect x="635" y="48" width="3" height="3"/>
      <rect x="100" y="210" width="3" height="3"/>
      <rect x="1085" y="188" width="4" height="4"/>
    </g>

    <g fill="#A8C7FA">
      <rect x="198" y="68" width="5" height="5"/>
      <rect x="199" y="61" width="3" height="3"/>
      <rect x="196" y="70" width="3" height="3"/>
      <rect x="456" y="65" width="5" height="5"/>
      <rect x="458" y="59" width="2" height="2"/>
      <rect x="841" y="106" width="5" height="5"/>
      <rect x="842" y="100" width="2" height="2"/>
      <rect x="1140" y="83" width="5" height="5"/>
    </g>

    <!-- Small pixel clouds -->
    <g fill="#34415F" opacity=".55">
      <rect x="40" y="112" width="42" height="8"/>
      <rect x="54" y="104" width="22" height="8"/>
      <rect x="87" y="112" width="18" height="8"/>

      <rect x="1010" y="157" width="48" height="8"/>
      <rect x="1025" y="149" width="25" height="8"/>
      <rect x="1058" y="157" width="17" height="8"/>
    </g>

    <!-- Distant mountains -->
    <path d="M0 260 L100 202 L170 246 L264 181 L350 255 L455 194 L530 254
             L632 205 L724 256 L815 195 L904 251 L1000 205 L1087 245 L1150 212
             L1200 242 L1200 420 L0 420 Z"
          fill="#17233D"/>

    <!-- Back hills -->
    <path d="M0 287 Q130 228 255 285 T510 277 T770 277 T1030 264 T1200 276
             L1200 420 L0 420 Z"
          fill="#172F42"/>

    <!-- Foreground hills -->
    <path d="M0 334 Q115 274 260 328 T520 322 T780 318 T1035 324 T1200 300
             L1200 420 L0 420 Z"
          fill="#102A38"/>

    <path d="M0 367 Q150 328 290 359 T575 353 T850 360 T1200 342
             L1200 420 L0 420 Z"
          fill="#0B202E"/>

    <!-- Castle on the left -->
    <g transform="translate(95 205)" stroke="#0A1429" stroke-width="4" stroke-linejoin="miter">
      <rect x="18" y="44" width="115" height="90" fill="#53617E"/>
      <rect x="5" y="30" width="37" height="104" fill="#66738E"/>
      <rect x="109" y="22" width="37" height="112" fill="#5B6986"/>
      <rect x="21" y="12" width="8" height="18" fill="#7B88A2"/>
      <rect x="7" y="14" width="8" height="16" fill="#7B88A2"/>
      <rect x="34" y="14" width="8" height="16" fill="#7B88A2"/>

      <path d="M3 30 L23 4 L44 30 Z" fill="#394968"/>
      <path d="M107 22 L128 0 L149 22 Z" fill="#394968"/>

      <rect x="15" y="36" width="17" height="24" fill="#D3B77C"/>
      <rect x="119" y="34" width="17" height="24" fill="#D3B77C"/>
      <rect x="58" y="65" width="31" height="69" fill="#283650"/>
      <path d="M55 65 L73 45 L92 65 Z" fill="#394968"/>

      <rect x="23" y="77" width="12" height="16" fill="#B9C9E4"/>
      <rect x="116" y="77" width="12" height="16" fill="#B9C9E4"/>

      <rect x="0" y="132" width="153" height="8" fill="#34425F"/>
      <rect x="15" y="140" width="125" height="5" fill="#1B3045"/>
    </g>

    <!-- Castle windows -->
    <g fill="#D6B977" opacity=".9">
      <rect x="120" y="245" width="7" height="13"/>
      <rect x="225" y="241" width="7" height="13"/>
      <rect x="169" y="272" width="9" height="14"/>
    </g>

    <!-- Floating golden blocks -->
    <g stroke="#352B25" stroke-width="4">
      <g transform="translate(330 166)">
        <rect width="43" height="43" fill="#9A7137"/>
        <rect x="4" y="4" width="35" height="35" fill="#D2A85B"/>
        <rect x="10" y="10" width="23" height="23" fill="#B88C48"/>
        <rect x="16" y="16" width="11" height="11" fill="#E7C77D"/>
        <rect x="7" y="7" width="5" height="5" fill="#F0D69B" stroke="none"/>
      </g>

      <g transform="translate(815 185)">
        <rect width="43" height="43" fill="#9A7137"/>
        <rect x="4" y="4" width="35" height="35" fill="#D2A85B"/>
        <rect x="10" y="10" width="23" height="23" fill="#B88C48"/>
        <rect x="16" y="16" width="11" height="11" fill="#E7C77D"/>
        <rect x="7" y="7" width="5" height="5" fill="#F0D69B" stroke="none"/>
      </g>
    </g>

    <!-- Floating coins -->
    <g stroke="#5E482C" stroke-width="3">
      <g transform="translate(399 181)">
        <rect x="6" y="0" width="14" height="5" fill="#E8C978"/>
        <rect x="1" y="5" width="24" height="27" fill="#C39B51"/>
        <rect x="6" y="7" width="14" height="23" fill="#E1BF6D"/>
        <rect x="9" y="11" width="8" height="15" fill="#F0D994"/>
      </g>
      <g transform="translate(888 156)">
        <rect x="6" y="0" width="14" height="5" fill="#E8C978"/>
        <rect x="1" y="5" width="24" height="27" fill="#C39B51"/>
        <rect x="6" y="7" width="14" height="23" fill="#E1BF6D"/>
        <rect x="9" y="11" width="8" height="15" fill="#F0D994"/>
      </g>
    </g>

    <!-- Main dark information panel -->
    <rect x="270" y="113" width="660" height="194" rx="5"
          fill="#080E20" fill-opacity=".91"
          stroke="#65799F" stroke-opacity=".62" stroke-width="2"/>

    <rect x="281" y="124" width="638" height="172" rx="3"
          fill="none" stroke="#9AADD1" stroke-opacity=".18" stroke-width="1"/>

    <!-- Panel pixel corner accents -->
    <g fill="#D0B36C">
      <rect x="270" y="113" width="17" height="5"/>
      <rect x="270" y="113" width="5" height="17"/>
      <rect x="913" y="113" width="17" height="5"/>
      <rect x="925" y="113" width="5" height="17"/>
      <rect x="270" y="290" width="17" height="5"/>
      <rect x="270" y="291" width="5" height="16"/>
      <rect x="913" y="302" width="17" height="5"/>
      <rect x="925" y="290" width="5" height="17"/>
    </g>

    <!-- Main title -->
    <text x="600" y="166"
          text-anchor="middle"
          font-family="monospace"
          font-size="17"
          font-weight="bold"
          letter-spacing="5"
          fill="#92A8D2">PLAYER PROFILE</text>

    <text x="600" y="213"
          text-anchor="middle"
          font-family="monospace"
          font-size="43"
          font-weight="bold"
          letter-spacing="1"
          fill="#F1F4FF">By ErinXrz</text>

    <!-- Career -->
    <rect x="378" y="231" width="444" height="2" fill="#657BA5" opacity=".65"/>

    <text x="600" y="254"
          text-anchor="middle"
          font-family="monospace"
          font-size="16"
          font-weight="bold"
          letter-spacing="1.4"
          fill="#D6E2FA">SYSTEMS ENGINEERING</text>

    <!-- Level badge -->
    <rect x="500" y="266" width="200" height="27" rx="2"
          fill="#263954" stroke="#D1B46E" stroke-width="1.5"/>

    <text x="600" y="285"
          text-anchor="middle"
          font-family="monospace"
          font-size="15"
          font-weight="bold"
          letter-spacing="2"
          fill="#F0D28C">LEVEL 08</text>

    <!-- Original pixel adventurer -->
    <g transform="translate(1000 258)" stroke="#11182A" stroke-width="4" stroke-linejoin="miter">
      <!-- shadow -->
      <ellipse cx="40" cy="113" rx="44" ry="9" fill="#070E1C" stroke="none"/>

      <!-- legs -->
      <rect x="17" y="79" width="21" height="30" fill="#284A75"/>
      <rect x="44" y="79" width="21" height="30" fill="#284A75"/>
      <rect x="12" y="101" width="29" height="13" fill="#18263C"/>
      <rect x="40" y="101" width="31" height="13" fill="#18263C"/>

      <!-- body -->
      <rect x="17" y="43" width="48" height="42" fill="#416CA1"/>
      <rect x="23" y="48" width="35" height="27" fill="#527FB3"/>
      <rect x="26" y="58" width="10" height="12" fill="#C8A96E"/>
      <rect x="45" y="58" width="10" height="12" fill="#C8A96E"/>

      <!-- arms -->
      <rect x="5" y="49" width="15" height="27" fill="#B86C4F"/>
      <rect x="62" y="49" width="15" height="27" fill="#B86C4F"/>
      <rect x="4" y="67" width="17" height="13" fill="#D2AE86"/>
      <rect x="61" y="67" width="17" height="13" fill="#D2AE86"/>

      <!-- head -->
      <rect x="21" y="17" width="43" height="34" fill="#D6AD87"/>
      <rect x="15" y="26" width="8" height="18" fill="#D6AD87"/>
      <rect x="62" y="27" width="7" height="15" fill="#D6AD87"/>

      <!-- hair -->
      <rect x="17" y="19" width="11" height="19" fill="#493A37"/>
      <rect x="22" y="14" width="40" height="8" fill="#493A37"/>
      <rect x="56" y="19" width="9" height="12" fill="#493A37"/>

      <!-- cap -->
      <rect x="14" y="7" width="49" height="14" fill="#963E49"/>
      <rect x="8" y="17" width="61" height="8" fill="#B4515A"/>
      <rect x="20" y="2" width="36" height="8" fill="#B4515A"/>
      <rect x="24" y="5" width="10" height="5" fill="#E1A0A1" stroke="none"/>

      <!-- face -->
      <rect x="31" y="30" width="5" height="6" fill="#202B3D" stroke="none"/>
      <rect x="49" y="30" width="5" height="6" fill="#202B3D" stroke="none"/>
      <rect x="38" y="42" width="14" height="4" fill="#8B5548" stroke="none"/>
    </g>

    <!-- Dark foreground framing -->
    <rect x="0" y="400" width="1200" height="20" fill="#070C18" opacity=".8"/>
    <rect x="0" y="400" width="1200" height="3" fill="#526B92" opacity=".55"/>

    <!-- Footer tagline -->
    <text x="600" y="388"
          text-anchor="middle"
          font-family="monospace"
          font-size="13"
          font-weight="bold"
          letter-spacing="3"
          fill="#B5C5E2">DEDICATION · INGENUITY · GROWTH</text>

    <!-- Small pixel grass and ground details -->
    <g fill="#355448" opacity=".85">
      <rect x="42" y="358" width="10" height="6"/>
      <rect x="52" y="352" width="7" height="6"/>
      <rect x="240" y="378" width="13" height="5"/>
      <rect x="260" y="372" width="7" height="6"/>
      <rect x="875" y="370" width="13" height="5"/>
      <rect x="895" y="364" width="7" height="6"/>
      <rect x="1135" y="352" width="10" height="6"/>
      <rect x="1145" y="346" width="7" height="6"/>
    </g>
  </g>
</svg>
